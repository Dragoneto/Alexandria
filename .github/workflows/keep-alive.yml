name: Keep-alive do Supabase

# O plano grátis do Supabase pausa o projeto depois de 7 dias sem uso do banco.
# A cada 3 dias este workflow chama o GET /api/health da API no Render, que roda
# um SELECT 1 no Postgres. O Render grátis dorme e leva cerca de 1 min para
# acordar, por isso as tentativas e o tempo de espera maiores.
# O GitHub só roda workflows agendados a partir da branch padrão (main).

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar o health check da API
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            https://alexandria-api-ybps.onrender.com/api/health
